<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque de codes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --fond: #f6f5f1; --carte: #ffffff; --texte: #1d1f21; --doux: #5f6368;
    --bord: #dedbd2; --accent: #0b6e4f; --accent-fond: #e3f1ea; --code: #f3f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #121417; --carte: #1b1e22; --texte: #e8e6e1; --doux: #9aa0a6;
      --bord: #2e3238; --accent: #4cc38a; --accent-fond: #1d3329; --code: #0d1117;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sous-titre { color: var(--doux); margin: 0 0 20px; }
  .recherche { position: sticky; top: 0; background: var(--fond); padding: 10px 0; z-index: 2; }
  input[type=search] { width: 100%; padding: 12px 14px; font-size: 1rem; border-radius: 10px;
         border: 1px solid var(--bord); background: var(--carte); color: var(--texte); }
  input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .barre { display: flex; gap: 10px; align-items: center; justify-content: space-between;
           margin-top: 10px; flex-wrap: wrap; color: var(--doux); font-size: .9rem; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--bord);
           background: var(--carte); color: var(--texte); font-size: .9rem; }
  .etiquettes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .etiquette { border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
               border-radius: 999px; padding: 3px 10px; font-size: .82rem; cursor: pointer; }
  .etiquette.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fiche { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px;
           margin-top: 12px; overflow: hidden; }
  .fiche summary { list-style: none; cursor: pointer; padding: 14px 16px; }
  .fiche summary::-webkit-details-marker { display: none; }
  .fiche summary h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .fiche summary p { margin: 0; color: var(--doux); font-size: .92rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .puce { font-size: .75rem; padding: 2px 8px; border-radius: 6px; background: var(--accent-fond); color: var(--accent); }
  .puce.langage { background: transparent; border: 1px solid var(--bord); color: var(--doux); }
  .contenu { border-top: 1px solid var(--bord); padding: 14px 16px; }
  .entete-code { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .entete-code span { font-size: .8rem; color: var(--doux); }
  button.copier { border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
                  border-radius: 8px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
  button.copier.ok { background: var(--accent); border-color: var(--accent); color: #fff; }
  pre { margin: 0; border-radius: 8px; overflow-x: auto; background: var(--code); }
  pre code.hljs, pre code { display: block; padding: 12px; font-size: .85rem; background: var(--code);
         font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .notes { margin-top: 14px; font-size: .93rem; }
  .notes h3 { font-size: .95rem; margin: 0 0 4px; }
  .notes code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: .85em; }
  .liens { margin-top: 12px; font-size: .85rem; display: flex; gap: 14px; }
  a { color: var(--accent); }
  .vide { text-align: center; color: var(--doux); padding: 40px 0; }
</style>
</head>
<body>
<div class="page">
  <h1>Banque de codes</h1>
  <p class="sous-titre">Codes réutilisables de mes études et projets. Clique sur une fiche pour l'ouvrir.</p>

  <div class="recherche">
    <input id="q" type="search" placeholder="Rechercher : titre, mot-clé, description, code, notes…" autocomplete="off">
    <div class="barre">
      <span id="compte"></span>
      <label>Trier :
        <select id="tri">
          <option value="titre">Titre (A → Z)</option>
          <option value="date">Plus récent</option>
          <option value="langage">Langage</option>
          <option value="projet">Projet</option>
        </select>
      </label>
    </div>
  </div>

  <div class="etiquettes" id="etiquettes"></div>
  <div id="liste"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DONNEES = /*__DONNEES__*/null;
const fiches = DONNEES.fiches;

// Recherche insensible aux accents et à la casse : "energie" trouve "Énergie".
const normaliser = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
fiches.forEach(f => {
  f._texte = normaliser([f.titre, f.description, f.mots_cles.join(" "), f.langage, f.projet, f.notes, f.code].join(" "));
});

const champ = document.getElementById("q");
const tri = document.getElementById("tri");
const liste = document.getElementById("liste");
const compte = document.getElementById("compte");
const zoneEtiquettes = document.getElementById("etiquettes");
const actives = new Set();

// Etiquettes cliquables, classées par fréquence.
const frequences = {};
fiches.forEach(f => f.mots_cles.forEach(m => frequences[m] = (frequences[m] || 0) + 1));
Object.keys(frequences).sort((a, b) => frequences[b] - frequences[a] || a.localeCompare(b, "fr")).forEach(m => {
  const b = document.createElement("button");
  b.className = "etiquette"; b.textContent = m;
  b.onclick = () => { actives.has(m) ? actives.delete(m) : actives.add(m); b.classList.toggle("active"); afficher(); };
  zoneEtiquettes.appendChild(b);
});

function echapper(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function rendreNotes(md) {
  if (!md) return "";
  const html = window.marked ? marked.parse(md) : "<pre>" + echapper(md) + "</pre>";
  return '<div class="notes"><h3>Notes</h3>' + html + "</div>";
}

function carte(f) {
  const d = document.createElement("details");
  d.className = "fiche";
  const cles = f.mots_cles.map(m => `<span class="puce">${echapper(m)}</span>`).join("");
  const liens = DONNEES.depot ? `<div class="liens">
      <a href="https://github.com/${DONNEES.depot}/blob/main/snippets/${encodeURIComponent(f.fichier)}" target="_blank">Voir la fiche</a>
      <a href="https://github.com/${DONNEES.depot}/edit/main/snippets/${encodeURIComponent(f.fichier)}" target="_blank">Modifier / ajouter des notes</a>
    </div>` : "";
  d.innerHTML = `
    <summary>
      <h2>${echapper(f.titre)}</h2>
      <p>${echapper(f.description)}</p>
      <div class="meta"><span class="puce langage">${echapper(f.langage)}</span>${cles}</div>
    </summary>
    <div class="contenu">
      <div class="entete-code"><span>${echapper(f.projet || "")}${f.date ? " · " + echapper(f.date) : ""}</span>
        <button class="copier">Copier le code</button></div>
      <pre><code class="language-${echapper(f.langage)}">${echapper(f.code)}</code></pre>
      ${rendreNotes(f.notes)}
      ${liens}
    </div>`;
  const bouton = d.querySelector("button.copier");
  bouton.onclick = async () => {
    try { await navigator.clipboard.writeText(f.code); }
    catch { const t = document.createElement("textarea"); t.value = f.code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    bouton.textContent = "Copié ✓"; bouton.classList.add("ok");
    setTimeout(() => { bouton.textContent = "Copier le code"; bouton.classList.remove("ok"); }, 1500);
  };
  d.addEventListener("toggle", () => {
    const bloc = d.querySelector("pre code");
    if (d.open && window.hljs && !bloc.dataset.highlighted) hljs.highlightElement(bloc);
  });
  return d;
}

function afficher() {
  const mots = normaliser(champ.value).split(/\s+/).filter(Boolean);
  let resultat = fiches.filter(f =>
    mots.every(m => f._texte.includes(m)) &&
    [...actives].every(e => f.mots_cles.includes(e)));

  const cle = tri.value;
  resultat.sort((a, b) => cle === "date"
    ? (b.date || "").localeCompare(a.date || "")
    : (a[cle] || "").localeCompare(b[cle] || "", "fr") || a.titre.localeCompare(b.titre, "fr"));

  liste.innerHTML = "";
  resultat.forEach(f => liste.appendChild(carte(f)));
  if (!resultat.length) liste.innerHTML = '<p class="vide">Aucune fiche ne correspond.</p>';
  compte.textContent = `${resultat.length} / ${fiches.length} fiche(s)`;

  const url = new URL(location); // garde la recherche dans l'adresse (?q=...) pour la retrouver
  champ.value ? url.searchParams.set("q", champ.value) : url.searchParams.delete("q");
  history.replaceState(null, "", url);
}

champ.value = new URLSearchParams(location.search).get("q") || "";
champ.addEventListener("input", afficher);
tri.addEventListener("change", afficher);
afficher();
</script>
</body>
</html>
