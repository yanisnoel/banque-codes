# À chaque push sur main : reconstruit le site, met à jour le catalogue du README, publie sur GitHub Pages.
name: Publier la banque de codes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # pour enregistrer le README mis à jour
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le site et le catalogue
        run: python outils/build.py

      - name: Enregistrer le README si le catalogue a changé
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Catalogue mis à jour automatiquement"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
